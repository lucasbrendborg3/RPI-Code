# NOTE: top-level keys are fully-qualified (/arm/...) rather than bare names.
# ros2_control_node and its internally-spawned controller nodes are launched
# with namespace='arm' (see arm.launch.py) so they resolve to /arm/<name>.
# A bare "controller_manager:" key does NOT match a namespaced node — ROS 2
# parameter YAML matching requires either the fully-qualified name or a /**
# wildcard, and a mismatched key silently loads no parameters (verified).
/arm/controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: forward_command_controller/ForwardCommandController

    gripper_action_controller:
      type: position_controllers/GripperActionController

    waveshare_velocity_controller:
      type: forward_command_controller/ForwardCommandController

# Joint state broadcaster - no parameters needed
/arm/joint_state_broadcaster:
  ros__parameters:

#ADD BACK JOINTS HERE if it fails to start
    joints:
      - joint1  # ODrive joints (0-2)
      - joint2
      - joint3
      - joint4  # Waveshare joints (3-5)
      - joint5
      - gripper1  # Gripper joint

/arm/arm_controller:
  ros__parameters:
    joints:
      - joint1  # ODrive joints (0-2)
      - joint2
      - joint3
      - joint4  # Waveshare joints (3-5)
      - joint5

    interface_name: position

/arm/waveshare_velocity_controller:
  ros__parameters:
    joints:
      - joint4  # We only apply this to the Waveshare servos
      - joint5
    interface_name: velocity

# GRIPPER CONTROLLER - matches main PC exactly
/arm/gripper_action_controller:
  ros__parameters:
    joint: gripper1
    action_monitor_rate: 20.0  # 20Hz as requested
    goal_tolerance: 0.1
    max_effort: 0.0
    allow_stalling: false
    stall_velocity_threshold: 0.01
    stall_timeout: 5.0